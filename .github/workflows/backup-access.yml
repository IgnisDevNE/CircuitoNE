name: Verify backup storage access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ matrix.environment }}
    concurrency:
      group: backup-probe-${{ matrix.name }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dev
            environment: Backup Dev
            ref: odphoxozclrshqjgwbqk
            other_ref: ukyoyrmebwadmuzkswdw
            pooler_host: aws-0-sa-east-1.pooler.supabase.com
            bucket: circuitone-backup-dev
            other_bucket: circuitone-backup-prod
          - name: production
            environment: Backup Producao
            ref: ukyoyrmebwadmuzkswdw
            other_ref: odphoxozclrshqjgwbqk
            pooler_host: aws-0-sa-east-1.pooler.supabase.com
            bucket: circuitone-backup-prod
            other_bucket: circuitone-backup-dev
    steps:
      - name: Reject a stale dispatch before using environment secrets
        shell: bash
        run: |
          set -euo pipefail
          main_head="$(git ls-remote https://github.com/IgnisDevNE/CircuitoNE.git refs/heads/main | cut -f 1)"
          if [[ ! "$main_head" =~ ^[0-9a-f]{40}$ || "$main_head" != "$GITHUB_SHA" ]]; then
            echo '::error::Source main advanced after this run was dispatched.'
            exit 1
          fi
      - name: Prepare pinned Supabase CA
        working-directory: ${{ runner.temp }}
        run: |
          curl --disable --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 20 --max-filesize 65536 --output supabase-ca.crt https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt
          echo '700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  supabase-ca.crt' | sha256sum --check --status
      - name: Verify database password over TLS in a read-only transaction
        env:
          BACKUP_ENV: ${{ matrix.name }}
          SUPABASE_PROJECT_REF: ${{ matrix.ref }}
          POOLER_HOST: ${{ matrix.pooler_host }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          node <<'BACKUP_DB'
          const { execFileSync } = require('node:child_process');
          try {
            const { BACKUP_ENV: name, SUPABASE_PROJECT_REF: ref, POOLER_HOST: host, SUPABASE_DB_PASSWORD: password } = process.env;
            const expected = { dev: 'odphoxozclrshqjgwbqk', production: 'ukyoyrmebwadmuzkswdw' };
            if (!Object.hasOwn(expected, name) || expected[name] !== ref ||
                !/^aws-[0-9]+-sa-east-1\.pooler\.supabase\.com$/.test(host) || !password) {
              throw new Error('Invalid backup database destination');
            }
            const sql = "BEGIN READ ONLY; SELECT current_database() = 'postgres' AND current_setting('transaction_read_only') = 'on'; ROLLBACK;";
            const result = execFileSync('psql', ['-X', '-w', '-A', '-t', '-q', '-v', 'ON_ERROR_STOP=1', '-c', sql], {
              env: {
                PATH: process.env.PATH,
                PGHOST: host, PGPORT: '5432', PGDATABASE: 'postgres',
                PGUSER: `postgres.${ref}`, PGPASSWORD: password,
                PGSSLMODE: 'verify-full', PGSSLROOTCERT: `${process.env.RUNNER_TEMP}/supabase-ca.crt`,
                PGCONNECT_TIMEOUT: '10', PGOPTIONS: '-c default_transaction_read_only=on -c statement_timeout=10000',
                PGAPPNAME: 'circuitone-backup-credential-check',
              },
              stdio: ['ignore', 'pipe', 'pipe'], encoding: 'utf8', timeout: 20000, maxBuffer: 4096,
            });
            if (result.trim() !== 't') throw new Error('Unexpected database result');
            console.log(`Backup database credential verified for ${name}; no data exported.`);
          } catch {
            console.error('::error::Backup database credential, destination or TLS verification failed; details omitted.');
            process.exitCode = 1;
          }
          BACKUP_DB
      - name: Verify isolated S3 credentials with a disposable R2 object
        id: storage
        shell: bash
        env:
          BACKUP_ENV: ${{ matrix.name }}
          SUPABASE_PROJECT_REF: ${{ matrix.ref }}
          OTHER_PROJECT_REF: ${{ matrix.other_ref }}
          R2_BUCKET: ${{ matrix.bucket }}
          OTHER_BUCKET: ${{ matrix.other_bucket }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          case "$BACKUP_ENV:$SUPABASE_PROJECT_REF:$OTHER_PROJECT_REF:$R2_BUCKET:$OTHER_BUCKET" in
            dev:odphoxozclrshqjgwbqk:ukyoyrmebwadmuzkswdw:circuitone-backup-dev:circuitone-backup-prod|production:ukyoyrmebwadmuzkswdw:odphoxozclrshqjgwbqk:circuitone-backup-prod:circuitone-backup-dev) ;;
            *) echo '::error::Backup destination mismatch.'; exit 1 ;;
          esac
          test -n "$SUPABASE_S3_ACCESS_KEY_ID" && test -n "$SUPABASE_S3_SECRET_ACCESS_KEY"
          test -n "$R2_ACCESS_KEY_ID" && test -n "$R2_SECRET_ACCESS_KEY"
          command -v aws >/dev/null

          (
            export AWS_ACCESS_KEY_ID="$SUPABASE_S3_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$SUPABASE_S3_SECRET_ACCESS_KEY"
            if ! aws s3api list-buckets --endpoint-url "https://$SUPABASE_PROJECT_REF.storage.supabase.co/storage/v1/s3" --region sa-east-1 >/dev/null 2>&1; then
              echo '::error::Supabase Storage S3 rejected the environment credential.'
              exit 1
            fi
            if aws s3api list-buckets --endpoint-url "https://$OTHER_PROJECT_REF.storage.supabase.co/storage/v1/s3" --region sa-east-1 >/dev/null 2>&1; then
              echo '::error::Supabase Storage credential unexpectedly reaches the other project.'
              exit 1
            fi
          )

          (
            export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
            endpoint='https://8ef7263b062ec08db392a2ef585cad86.r2.cloudflarestorage.com'
            if ! aws s3api head-bucket --bucket "$R2_BUCKET" --endpoint-url "$endpoint" --region auto >/dev/null 2>&1; then
              echo '::error::R2 rejected the assigned bucket.'
              exit 1
            fi
            if aws s3api head-bucket --bucket "$OTHER_BUCKET" --endpoint-url "$endpoint" --region auto >/dev/null 2>&1; then
              echo '::error::R2 credential unexpectedly reaches the other environment.'
              exit 1
            fi
            probe="probes/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$BACKUP_ENV"
            printf 'CircuitoNE backup access probe\n' > "$RUNNER_TEMP/backup-probe"
            aws s3api put-object --bucket "$R2_BUCKET" --key "$probe" --body "$RUNNER_TEMP/backup-probe" --endpoint-url "$endpoint" --region auto >/dev/null
            aws s3api get-object --bucket "$R2_BUCKET" --key "$probe" "$RUNNER_TEMP/backup-probe-read" --endpoint-url "$endpoint" --region auto >/dev/null
            cmp "$RUNNER_TEMP/backup-probe" "$RUNNER_TEMP/backup-probe-read"
          )
      - name: Remove disposable probe even after a failed read
        if: always() && steps.storage.outcome != 'skipped'
        shell: bash
        env:
          BACKUP_ENV: ${{ matrix.name }}
          R2_BUCKET: ${{ matrix.bucket }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          probe="probes/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$BACKUP_ENV"
          endpoint='https://8ef7263b062ec08db392a2ef585cad86.r2.cloudflarestorage.com'
          if ! aws s3api delete-object --bucket "$R2_BUCKET" --key "$probe" --endpoint-url "$endpoint" --region auto >/dev/null 2>&1; then
            echo '::error::Failed to remove the disposable R2 probe.'
            exit 1
          fi
      - name: Report scope
        run: echo "Backup storage access verified for ${{ matrix.name }}; no database backup was made."
