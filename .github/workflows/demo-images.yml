name: Demo images

# Arte gerada para os artistas e coletivos das contas demo do CircuitoNE-dev (scripts/demo-images.mjs). Manual e idempotente.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: circuitone-dev-demo-images
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Homologação
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Generate and upload demo images
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          FIXTURE_PASSWORD: ${{ secrets.FIXTURE_PASSWORD }}
        run: node scripts/demo-images.mjs
