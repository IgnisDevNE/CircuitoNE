name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; runtime Node 24
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --audit-level=high
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:coverage
      - name: Preserve LCOV for Codecov
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-lcov
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: error
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports
          path: |
            playwright-report/
            coverage/
          retention-days: 7
          if-no-files-found: warn

  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Supabase local descartável (Docker); nenhum projeto remoto.
      - run: pnpm test:database

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Supabase local descartável (Docker): Postgres + Auth + PostgREST, com as migrações do repositório.
      - name: Start local Supabase
        run: pnpm exec supabase start
      - name: Load synthetic seeds
        env:
          PGHOST: 127.0.0.1
          PGPORT: '55432'
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          {
            echo "set circuitone.seed_target='disposable';"
            echo "set circuitone.seed_time='$(date -u +%Y-%m-%dT%H:%M:%SZ)';"
            for seed in identity collectives events messages; do echo "\\i supabase/seeds/$seed.sql"; done
          } | psql -X -w -v ON_ERROR_STOP=1
      - name: Export local API URL and publishable key
        run: |
          status=$(pnpm --silent exec supabase status -o env)
          url=$(sed -nE 's/^API_URL="?([^"]*)"?$/\1/p' <<< "$status")
          key=$(sed -nE 's/^PUBLISHABLE_KEY="?([^"]*)"?$/\1/p' <<< "$status")
          if [[ -z "$url" || "$key" != sb_publishable_* ]]; then
            echo "API_URL/PUBLISHABLE_KEY not found in 'supabase status -o env'; variables present:" >&2
            cut -d= -f1 <<< "$status" >&2
            exit 1
          fi
          {
            echo "SUPABASE_URL=$url"
            echo "SUPABASE_PUBLISHABLE_KEY=$key"
          } >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      # Build, servidor SSR em development (Supabase local) e testes ficam no webServer de playwright.db.config.ts.
      - run: pnpm test:e2e:db
      - name: Supabase diagnostics
        if: failure()
        run: |
          docker ps --all --format '{{.Names}}\t{{.Status}}'
          for container in supabase_rest_circuitone-local supabase_kong_circuitone-local; do
            echo "--- $container"
            docker logs --tail 40 "$container" || true
          done
      - name: Preserve e2e reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-reports
          path: |
            playwright-report/db/
            test-results/db/
          retention-days: 7
          if-no-files-found: warn
