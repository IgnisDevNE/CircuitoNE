name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; runtime Node 24
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --audit-level=high
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:coverage
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports
          path: |
            playwright-report/
            coverage/
          retention-days: 7
          if-no-files-found: warn
      - name: Build container
        run: docker build -t circuitone-ci .
      - name: Test container routes
        run: |
          docker run --detach --name circuitone-ci --read-only --cap-drop ALL --security-opt no-new-privileges --memory 128m -p 127.0.0.1:5176:8080 circuitone-ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5176/ > /dev/null; then break; fi
            sleep 1
          done
          pnpm test:hosting

  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Banco descartável; nenhum environment/secreto/projeto remoto vinculado.
      - run: pnpm test:database
