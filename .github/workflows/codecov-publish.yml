name: Codecov self-hosted publisher

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  publish:
    if: >-
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.repository.full_name == 'IgnisDevNE/CircuitoNE' &&
      github.event.workflow_run.head_repository.full_name == 'IgnisDevNE/CircuitoNE' &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Codecov Upload
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Resolve trusted source metadata
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'SOURCE'
          const { appendFileSync, readFileSync } = require('node:fs');
          const run = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')).workflow_run;
          const sha = run.head_sha;
          async function resolve() {
            if (run.path?.split('@', 1)[0] !== '.github/workflows/ci.yml') throw new Error('Unexpected source workflow');
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid source SHA');
            if (!Number.isSafeInteger(run.id) || run.id < 1) throw new Error('Invalid source run');
            const jobsResponse = await fetch(`https://api.github.com/repos/IgnisDevNE/CircuitoNE/actions/runs/${run.id}/jobs?per_page=100&filter=latest`, {
              headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${process.env.GH_TOKEN}` },
              signal: AbortSignal.timeout(15000),
            });
            if (!jobsResponse.ok) throw new Error(`CI jobs lookup failed (HTTP ${jobsResponse.status})`);
            const jobs = await jobsResponse.json();
            if (!Number.isSafeInteger(jobs.total_count) || jobs.total_count > 100 ||
                !Array.isArray(jobs.jobs) || jobs.total_count !== jobs.jobs.length) throw new Error('Unexpected CI jobs response');
            for (const name of ['quality', 'database']) {
              const matches = jobs.jobs.filter(job => job.name === name);
              if (matches.length !== 1 || matches[0].conclusion !== 'success') throw new Error(`Required CI job did not pass: ${name}`);
            }
            let pr = '';
            let branch = run.head_branch;
            if (run.event === 'pull_request') {
              const response = await fetch(`https://api.github.com/repos/IgnisDevNE/CircuitoNE/commits/${sha}/pulls`, {
                headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${process.env.GH_TOKEN}` },
                signal: AbortSignal.timeout(15000),
              });
              if (!response.ok) throw new Error(`PR lookup failed (HTTP ${response.status})`);
              const matches = (await response.json()).filter(item =>
                item.head?.sha === sha && item.head?.repo?.full_name === 'IgnisDevNE/CircuitoNE' &&
                item.head?.ref === branch && item.base?.repo?.full_name === 'IgnisDevNE/CircuitoNE');
              if (matches.length !== 1) throw new Error('Expected one PR for source SHA and branch');
              pr = String(matches[0].number);
            } else if (run.event !== 'push' || branch !== 'main') {
              throw new Error('Unexpected source event');
            }
            if (!/^[A-Za-z0-9._/-]+$/.test(branch)) throw new Error('Invalid source branch');
            appendFileSync(process.env.GITHUB_OUTPUT, `pr=${pr}\nbranch=${branch}\n`);
          }
          resolve().catch(error => { console.error(error.message); process.exitCode = 1; });
          SOURCE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: codecov-lcov
          path: .codecov-reports
      - name: Require nonempty coverage
        run: test -s .codecov-reports/lcov.info
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          url: https://pipeline.magalz.space
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: IgnisDevNE/CircuitoNE
          files: .codecov-reports/lcov.info
          override_commit: ${{ github.event.workflow_run.head_sha }}
          override_branch: ${{ steps.source.outputs.branch }}
          override_pr: ${{ steps.source.outputs.pr }}
          override_build: ${{ github.event.workflow_run.id }}
          override_build_url: ${{ github.event.workflow_run.html_url }}
          disable_search: true
          disable_file_fixes: true
          disable_telem: true
          plugins: noop
          fail_ci_if_error: true
