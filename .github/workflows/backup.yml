name: Daily database and Storage backup

on:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * *'

permissions:
  contents: read

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ matrix.environment }}
    concurrency:
      group: circuitone-backup-${{ matrix.name }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dev
            environment: Backup Dev
            ref: odphoxozclrshqjgwbqk
            bucket: circuitone-backup-dev
    steps:
      - name: Reject stale main before using backup secrets
        shell: bash
        run: |
          set -euo pipefail
          main_head="$(git ls-remote https://github.com/IgnisDevNE/CircuitoNE.git refs/heads/main | cut -f 1)"
          if [[ ! "$main_head" =~ ^[0-9a-f]{40}$ || "$main_head" != "$GITHUB_SHA" ]]; then
            echo '::error::Source main advanced after dispatch; run again at the current SHA.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Prepare pinned Supabase CA
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          curl --disable --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 20 --max-filesize 65536 --output supabase-ca.crt https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt
          echo '700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  supabase-ca.crt' | sha256sum --check --status
      - name: Export, upload, read back and rotate one backup
        env:
          BACKUP_ENV: ${{ matrix.name }}
          SUPABASE_PROJECT_REF: ${{ matrix.ref }}
          R2_BUCKET: ${{ matrix.bucket }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/backup.mjs
