name: QA trigger

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  dispatch:
    if: >-
      vars.CANONICAL_QA_ENABLED == 'true' &&
      github.event.workflow_run.repository.full_name == 'IgnisDevNE/CircuitoNE' &&
      github.event.workflow_run.head_repository.full_name == 'IgnisDevNE/CircuitoNE' &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: QA Dispatch
    steps:
      - name: Trigger independent QA workflow
        env:
          QA_DISPATCH_TOKEN: ${{ secrets.QA_DISPATCH_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          node --input-type=module <<'DISPATCH_QA'
          const token = process.env.QA_DISPATCH_TOKEN;
          const runId = process.env.SOURCE_RUN_ID;
          const mode = process.env.SOURCE_EVENT === 'push' ? 'promote' : 'accept';
          if (!token || !/^[1-9][0-9]*$/.test(runId)) throw new Error('QA dispatch configuration is incomplete');
          const response = await fetch('https://api.github.com/repos/IgnisDevNE/CircuitoNE-QA/actions/workflows/canonical.yml/dispatches', {
            method: 'POST',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${token}`,
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2026-03-10',
            },
            body: JSON.stringify({ ref: 'main', inputs: { source_run_id: runId, mode } }),
            signal: AbortSignal.timeout(15000),
          });
          if (response.status !== 204) throw new Error(`QA dispatch rejected (HTTP ${response.status})`);
          console.log(`Independent QA requested for source run ${runId}.`);
          DISPATCH_QA
