name: Homologate database migrations

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      manifest_digest: ${{ steps.manifest.outputs.digest }}
      manifest_artifact: ${{ steps.receipt.outputs.artifact-id }}
    steps:
      - name: Reject disabled or non-main run
        env:
          ENABLED: ${{ vars.HOMOLOGATION_DB_WRITE_ENABLED }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_REF" != refs/heads/main ] || [ "$ENABLED" != true ]; then
            echo '::error::Homologação desativada ou fora da main.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rebuild disposable database twice
        run: pnpm test:database
      - name: Record reviewed migration manifest
        id: manifest
        shell: bash
        run: |
          workdir="$(node scripts/prepare-local-db.mjs --homologation)"
          digest="$(sha256sum "$workdir/manifest.json" | cut -d ' ' -f 1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "workdir=$workdir" >> "$GITHUB_OUTPUT"
          printf '## Plano de migrações\n\nSHA: `%s`\n\nManifesto SHA-256: `%s`\n\n' "$GITHUB_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"
          printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$workdir/manifest.json" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish only the reviewed manifest, never data or credentials
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homologation-manifest-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.manifest.outputs.workdir }}/manifest.json
          if-no-files-found: error
          retention-days: 90

  apply:
    name: apply-homologation
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: Homologação
    concurrency:
      group: circuitone-dev-migrations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Recreate reviewed manifest
        id: manifest
        shell: bash
        run: |
          workdir="$(node scripts/prepare-local-db.mjs --homologation)"
          echo "workdir=$workdir" >> "$GITHUB_OUTPUT"
          echo "digest=$(sha256sum "$workdir/manifest.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.manifest_artifact }}
          path: ${{ runner.temp }}/reviewed-manifest
          merge-multiple: true
      - name: Verify source, destination and migration bytes
        env:
          HOMOLOGATION_DB_WRITE_ENABLED: ${{ vars.HOMOLOGATION_DB_WRITE_ENABLED }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          PLAN_DIGEST: ${{ needs.plan.outputs.manifest_digest }}
          ACTUAL_DIGEST: ${{ steps.manifest.outputs.digest }}
          WORKDIR: ${{ steps.manifest.outputs.workdir }}
        shell: bash
        run: |
          export MAIN_HEAD="$(git ls-remote https://github.com/IgnisDevNE/CircuitoNE.git refs/heads/main | cut -f 1)"
          node scripts/validate-homologation.mjs
          cmp "$WORKDIR/manifest.json" "$RUNNER_TEMP/reviewed-manifest/manifest.json"
      - name: Prepare pinned Supabase CA
        working-directory: ${{ runner.temp }}
        run: |
          curl --disable --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 20 --max-filesize 65536 --output supabase-ca.crt https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt
          echo '700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  supabase-ca.crt' | sha256sum --check --status
      - name: Resolve and verify CircuitoNE-dev pooler
        id: pooler
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node <<'POOLER'
          const { appendFileSync } = require('node:fs');
          (async () => {
            if (!process.env.SUPABASE_ACCESS_TOKEN?.trim()) throw new Error('Missing token');
            const response = await fetch('https://api.supabase.com/v1/projects/odphoxozclrshqjgwbqk/config/database/pooler', {
              headers: { Authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}` },
              redirect: 'error', signal: AbortSignal.timeout(15000),
            });
            if (!response.ok) throw new Error('Rejected token');
            const chunks = [];
            let size = 0;
            for await (const chunk of response.body) {
              size += chunk.byteLength;
              if (size > 65536) throw new Error('Oversized response');
              chunks.push(chunk);
            }
            const host = JSON.parse(Buffer.concat(chunks).toString('utf8'))
              .find(config => config.database_type === 'PRIMARY')?.db_host;
            if (typeof host !== 'string' || !/^aws-[0-9]+-sa-east-1\.pooler\.supabase\.com$/.test(host)) {
              throw new Error('Unexpected host');
            }
            appendFileSync(process.env.GITHUB_OUTPUT, `host=${host}\n`);
          })().catch(() => {
            console.error('::error::Não foi possível validar o pooler de CircuitoNE-dev.');
            process.exitCode = 1;
          });
          POOLER
      - name: Apply reviewed migrations, seeds and SQL/REST smoke under one database session lock
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          PGHOST: ${{ steps.pooler.outputs.host }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.odphoxozclrshqjgwbqk
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ runner.temp }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '10'
          WORKDIR: ${{ steps.manifest.outputs.workdir }}
          MANIFEST_DIGEST: ${{ steps.manifest.outputs.digest }}
        shell: bash
        run: |
          node scripts/apply-homologation.mjs apply "$WORKDIR" "$MANIFEST_DIGEST"
      - name: Record homologation result
        env:
          MANIFEST_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          printf '## Migrações em CircuitoNE-dev\n\nSHA: `%s`\n\nManifesto SHA-256: `%s`\n\nDestino: `odphoxozclrshqjgwbqk`. Migrações pendentes, quatro seeds idempotentes sintéticos e verificações SQL/REST/Auth/MFA concluídos sob trava de sessão. Nenhum reset, deploy ou alteração de produção.\n' "$GITHUB_SHA" "$MANIFEST_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Record failed homologation
        if: failure() || cancelled()
        run: |
          printf '## Homologação reprovada\n\nSHA: `%s`. Confira a etapa com falha; não houve promoção de aplicação ou produção. Uma falha após `db push` pode ter aplicado migrações e exige inspeção antes de repetir.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
