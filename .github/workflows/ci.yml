name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --audit-level=high
      - name: Build container
        run: docker build -t circuitone-ci .
      - name: Test container routes
        run: |
          docker run --detach --name circuitone-ci --read-only --cap-drop ALL --security-opt no-new-privileges --memory 128m -p 127.0.0.1:5176:8080 circuitone-ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5176/ > /dev/null; then break; fi
            sleep 1
          done
          pnpm test:hosting
