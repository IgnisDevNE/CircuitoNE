name: Request protected maintenance

on:
  workflow_dispatch:
    inputs:
      workflow:
        description: Protected operation on current main (approval remains required)
        required: true
        type: choice
        options: [homologate.yml, backup.yml, restore-drill.yml, validate-production.yml]

permissions: {}

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main' && github.actor == 'magalz' && github.triggering_actor == 'magalz'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Dispatch only the selected protected main workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUEST_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          TARGET_WORKFLOW: ${{ inputs.workflow }}
        run: |
          node --input-type=module <<'MAINTENANCE'
          const e = process.env;
          if (e.GITHUB_REPOSITORY !== 'IgnisDevNE/CircuitoNE' || e.GITHUB_EVENT_NAME !== 'workflow_dispatch' ||
              e.GITHUB_REF !== 'refs/heads/main' || e.REQUEST_ACTOR !== 'magalz' || e.TRIGGERING_ACTOR !== 'magalz' ||
              !['homologate.yml','backup.yml','restore-drill.yml','validate-production.yml'].includes(e.TARGET_WORKFLOW)) {
            throw new Error('Unauthorized maintenance request');
          }
          const headers = {Authorization: `Bearer ${e.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10'};
          const endpoint = 'https://api.github.com/repos/IgnisDevNE/CircuitoNE';
          const head = await fetch(endpoint + '/git/ref/heads/main', {headers, redirect:'error', signal:AbortSignal.timeout(15000)});
          if (!head.ok || (await head.json()).object?.sha !== e.GITHUB_SHA) throw new Error('Maintenance main advanced');
          const response = await fetch(endpoint + '/actions/workflows/' + e.TARGET_WORKFLOW + '/dispatches', {
            method:'POST', headers:{...headers,'Content-Type':'application/json'}, body:JSON.stringify({ref:'main'}),
            redirect:'error', signal:AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error(`Maintenance dispatch rejected (HTTP ${response.status})`);
          console.log(`Requested ${e.TARGET_WORKFLOW} on main from ${e.GITHUB_SHA}; destination approvals and guards remain required.`);
          MAINTENANCE
